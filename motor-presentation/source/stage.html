<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#050a12;overflow:hidden}
#root{position:relative;background:radial-gradient(ellipse 75% 70% at 50% 42%, #16314f 0%, #0b1a2c 45%, #050b14 100%);overflow:hidden;font-family:Inter,Arial}
#root canvas{position:absolute;left:0;top:0}
